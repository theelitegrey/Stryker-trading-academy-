# Deploys the order-book recorder Worker (workers/book-recorder) with wrangler, using the same
# Cloudflare secrets as the site deploy. Runs the unit tests first; a failing test stops it.
# Rollback: see workers/book-recorder/README.md (wrangler rollback, or delete the Worker).
name: Deploy book recorder Worker

on:
  push:
    branches: [main]
    paths: ['workers/book-recorder/**', '.github/workflows/deploy-book-recorder.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-recorder-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub environment that only allows the main branch (deployment branch policy "main"), so a
    # probe branch with a copy of this job can no longer deploy the production Worker.
    environment: book-recorder-production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Unit tests (bucketing parity, wire format, merge)
        run: node workers/book-recorder/test/parity.test.mjs
      - name: GEX chain ingest tests
        run: node workers/book-recorder/test/gex.test.mjs
      - name: GEX history tests (feeder vs engine parity, validation, no-lookahead lookup)
        run: node workers/book-recorder/test/gex-history.test.mjs
      - name: Options analytics tests (feeder maths, ingest validation)
        run: |
          python3 workers/book-recorder/test/opt_feeder_test.py
          node workers/book-recorder/test/options.test.mjs
      - name: Market scanner tests (screener query building, presets, ingest validation, routes)
        run: |
          python3 workers/book-recorder/test/scan_feeder_test.py
          node workers/book-recorder/test/scan.test.mjs
      - name: News + calendar tests (tagging, dedupe, replay cut-off, validation, local round trip)
        run: node workers/book-recorder/test/news.test.mjs
      - name: Order-flow tests (feeder vs raw ticks, footprint maths, 1-second path, no-lookahead, validation)
        run: node workers/book-recorder/test/orderflow.test.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INGEST_SECRET: ${{ secrets.BOOK_INGEST_SECRET }}
        run: |
          echo "::add-mask::$INGEST_SECRET"
          # Same clean-up as deploy-site.yml: the secrets were pasted with extra text around them.
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{35,}' | tail -1 || true)
          [ -z "$TOKEN" ] && TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-f]{32}' | head -1 || true)
          if [ -z "$ACCOUNT" ]; then
            ACCOUNT=$(curl -s -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')
          fi
          echo "::add-mask::$ACCOUNT"
          [ -z "$ACCOUNT" ] && { echo "::error::no Cloudflare account visible to the token"; exit 1; }
          SUB=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')
          echo "workers.dev subdomain: ${SUB:-none}"
          cd workers/book-recorder
          CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT" npx --yes wrangler@4.149.0 deploy 2>&1 | tee /tmp/deploy.log
          test "${PIPESTATUS[0]}" = 0
          # the feeder's shared secret (GitHub secret BOOK_INGEST_SECRET; the same value lives in
          # /root/projects/book-feeder/feeder.env on the server). Piped on stdin, never echoed.
          if [ -n "$INGEST_SECRET" ]; then
            printf '%s' "$INGEST_SECRET" | CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT" npx --yes wrangler@4.149.0 secret put INGEST_SECRET >/dev/null 2>&1 \
              && echo "INGEST_SECRET set" || { echo "::error::could not set INGEST_SECRET"; exit 1; }
          else
            echo "::error::BOOK_INGEST_SECRET repo secret is missing"; exit 1
          fi
      - name: Smoke test
        run: |
          URL=$(grep -oE 'https://book-recorder\.[a-z0-9-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "Worker: $URL"
          curl -s "$URL/status" | jq -c '{last, symbols: (.symbols | map_values({samples, from, to}))}'
          # /ingest refuses a request without the secret
          c401=$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary 'x' "$URL/ingest?symbols=BTCUSDT")
          echo "ingest without key: HTTP $c401"; test "$c401" = 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://tradezoro.com' "$URL/book-history?symbol=BTCUSDT")
          echo "book-history: HTTP $code"
          test "$code" = 200
          g401=$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary 'x' "$URL/gex-ingest?sym=QQQ&part=near")
          echo "gex-ingest without key: HTTP $g401"; test "$g401" = 401
          s401=$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary 'x' "$URL/gex-snap")
          echo "gex-snap without key: HTTP $s401"; test "$s401" = 401
          # a new Worker version takes a few seconds to reach every edge: retry before failing
          for i in 1 2 3 4 5 6; do
            h=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://strykertrading.com' "$URL/gex-history?u=SPX&dte=0")
            [ "$h" = 200 ] && break; sleep 10
          done
          echo "gex-history: HTTP $h"; test "$h" = 200
          ss=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://strykertrading.com' "$URL/gex-sessions")
          echo "gex-sessions: HTTP $ss"; test "$ss" = 200
          o401=$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary 'x' "$URL/opt-ingest")
          echo "opt-ingest without key: HTTP $o401"; test "$o401" = 401
          oa=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://strykertrading.com' "$URL/opt-analytics?u=SPX")
          echo "opt-analytics: HTTP $oa (404 = no feeder data yet)"; test "$oa" = 200 -o "$oa" = 404
          # the new version can take a few seconds to reach every edge (the old one answers 405/404)
          for i in 1 2 3 4 5 6; do
            n401=$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary '{}' "$URL/news-ingest")
            [ "$n401" = 401 ] && break; sleep 10
          done
          echo "news-ingest without key: HTTP $n401"; test "$n401" = 401
          nw=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://strykertrading.com' "$URL/news?sym=NQ")
          echo "news: HTTP $nw"; test "$nw" = 200
          cl=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://strykertrading.com' "$URL/cal?kind=events")
          echo "cal: HTTP $cl"; test "$cl" = 200
          f401=$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary 'x' "$URL/of-ingest?sym=NQ")
          echo "of-ingest without key: HTTP $f401"; test "$f401" = 401
          of=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://strykertrading.com' "$URL/orderflow?sym=NQ")
          echo "orderflow: HTTP $of"; test "$of" = 200
          t1=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://strykertrading.com' "$URL/ticks1s?sym=NQ")
          echo "ticks1s: HTTP $t1"; test "$t1" = 200
