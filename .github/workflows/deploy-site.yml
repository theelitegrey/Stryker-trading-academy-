# Deploys the site to Cloudflare Pages on every push to main, via direct
# upload (wrangler). This replaced the dashboard's Git integration after it
# silently stopped building post-migration and froze the site at build 193 —
# a deploy that lives in the repo can be watched, debugged, and retried from
# code, with no dashboard toggle to drift.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  — API token with the Cloudflare Pages edit scope
#   CLOUDFLARE_ACCOUNT_ID — dashboard home -> right sidebar -> Account ID
#
# The data branch (pushed every 20 min by monitor-data.yml) does NOT trigger
# this — only main does, exactly like the old GitHub Pages behavior.
#
# If the dashboard's own Git integration ever gets re-enabled, the worst
# case is a duplicate deploy of identical content — harmless.

name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # revive the monitor-data relay if its data has gone stale

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find the Pages project
        id: proj
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Secrets arrive as pasted — sometimes with a "Bearer " prefix, an
          # example command, or stray whitespace around the real value. Run 2
          # failed with Cloudflare's "Invalid format for Authorization
          # header", which is exactly that. So extract the value instead of
          # trusting the paste: an API token is a long [A-Za-z0-9_-] run, an
          # account id is 32 hex chars.
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{35,}' | tail -1 || true)
          [ -z "$TOKEN" ] && TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-f]{32}' | head -1 || true)
          [ -z "$ACCOUNT" ] && ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing (repo Settings -> Secrets -> Actions)"; exit 1; fi
          if [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing — copy the Account ID from the Cloudflare dashboard home page (right-hand sidebar)"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          echo "Extracted token length: ${#TOKEN} (Cloudflare API tokens are 40); account id length: ${#ACCOUNT} (should be 32)."
          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"

          # Step 1: is the token itself valid? (scope-independent check)
          verify=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          if [ "$(echo "$verify" | jq -r '.success')" != "true" ]; then
            echo "::error::The API token is not valid: $(echo "$verify" | jq -c '.errors') — if you copied the Global API Key, that won't work; create an API TOKEN (My Profile -> API Tokens -> Create Token) instead."; exit 1; fi
          echo "Token is valid."

          # Step 2: resolve the account. If the ACCOUNT secret isn't a clean
          # 32-hex id (run 4: the token was pasted into both secrets), ask
          # Cloudflare which accounts this token can see and pick the one
          # that actually has a Pages project.
          if ! printf '%s' "$ACCOUNT" | grep -qE '^[0-9a-f]{32}$'; then
            echo "CLOUDFLARE_ACCOUNT_ID is not a 32-hex account id — auto-discovering from the token."
            accts=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts?per_page=25")
            found=""
            for id in $(echo "$accts" | jq -r '.result[].id // empty'); do
              probe=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/$id/pages/projects")
              if [ "$(echo "$probe" | jq -r '.success')" = "true" ] && \
                 [ "$(echo "$probe" | jq '.result | length')" -gt 0 ]; then found="$id"; break; fi
            done
            if [ -z "$found" ]; then
              echo "::error::Could not auto-discover an account with Pages projects — the token may lack the 'Account Settings: Read' or 'Cloudflare Pages: Edit' permission. Fix the CLOUDFLARE_ACCOUNT_ID secret to the 32-character Account ID from the dashboard sidebar."; exit 1; fi
            ACCOUNT="$found"
            echo "::add-mask::$ACCOUNT"
            echo "CF_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
            echo "Auto-discovered the account id."
          fi

          # Step 3: can it list Pages projects on this account?
          resp=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/pages/projects")
          if [ "$(echo "$resp" | jq -r '.success')" != "true" ]; then
            echo "::error::Pages API refused the request: $(echo "$resp" | jq -c '.errors') — the token needs the 'Cloudflare Pages: Edit' account permission, and the Account ID must match the account that owns the Pages project."; exit 1; fi
          # Show the full project/domain layout — run 5 deployed successfully
          # yet the live domain kept serving old content, which smells like
          # two projects with the domain on the other one.
          echo "Projects on this account:"
          echo "$resp" | jq -r '.result[] | "  - " + .name + "  domains: " + ((.domains // []) | join(", "))'

          # The right project is the one that OWNS the custom domain.
          name=$(echo "$resp" | jq -r '.result[] | select((.domains // []) | map(test("strykertrading"; "i")) | any) | .name' | head -1)
          if [ -n "$name" ]; then
            echo "Selected by custom domain: $name"
          else
            name=$(echo "$resp" | jq -r '.result[].name' | grep -i 'stryker' | head -1)
            [ -z "$name" ] && name=$(echo "$resp" | jq -r '.result[0].name // empty')
            echo "No project carries the custom domain — falling back to: $name"
          fi
          if [ -z "$name" ]; then
            echo "::error::No Pages project found on this Cloudflare account"; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Deploying to Pages project: $name"

      - name: Assemble the site (repo internals excluded)
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' \
                   --exclude 'functions-src' --exclude 'node_modules' ./ /tmp/site/

      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          npx --yes wrangler@4 pages deploy /tmp/site \
            --project-name "${{ steps.proj.outputs.name }}" \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-dirty=false

      # Trust nothing until the DOMAIN serves it: a deploy has gone green
      # before while strykertrading.com kept serving old content (two Pages
      # projects, run 5), and wrangler's "already uploaded" dedupe count is
      # useless as a signal. version.json is Cache-Control: no-store, so what
      # this reads is what every visitor's stale-page check reads.
      - name: Verify the live domain serves this build
        run: |
          want=$(node -e "console.log(require('./assets/version.json').build)")
          got=0
          for i in 1 2 3 4 5 6; do
            sleep 10
            got=$(curl -sf "https://strykertrading.com/assets/version.json?t=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).build||0))" 2>/dev/null || echo 0)
            echo "attempt $i: live build $got (want $want)"
            if [ "$got" = "$want" ]; then
              page=$(curl -sf "https://strykertrading.com/index.html?t=$(date +%s)" | grep -o 'stryker-build" content="[0-9]*"' || true)
              echo "live version.json matches; homepage meta: ${page:-unreadable}"
              exit 0
            fi
          done
          echo "::error::strykertrading.com still serves build $got after deploying build $want — production is not picking up the new deployment (check which deployment is live in the Pages dashboard)."
          exit 1

      # Every deploy doubles as a watchdog for the Global Monitor relay:
      # if the published data is older than 45 minutes the chain has died
      # (GitHub's cron alone proved unable to keep it alive), so restart it.
      - name: Revive the monitor-data relay if stale
        if: always()
        run: |
          gen=$(curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/data/monitor-data.json?t=$(date +%s)"             | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).generatedAt||0))" 2>/dev/null || echo 0)
          now=$(date +%s%3N)
          age_min=$(( (now - gen) / 60000 ))
          echo "monitor data age: ${age_min} minutes"
          if [ "$age_min" -gt 45 ]; then
            curl -sf -X POST               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor-data.yml/dispatches"               -d '{"ref":"main"}' && echo "relay revived" || echo "could not dispatch relay"
          else
            echo "relay healthy"
          fi
