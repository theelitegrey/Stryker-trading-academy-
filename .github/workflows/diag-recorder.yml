name: Diag recorder tail
on:
  push:
    branches: [hermes/w1-recorder-diag]
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{35,}' | tail -1 || true)
          [ -z "$TOKEN" ] && TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-f]{32}' | head -1 || true)
          echo "::add-mask::$ACCOUNT"
          cd workers/book-recorder
          export CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"
          (timeout 60 npx --yes wrangler@4.149.0 tail book-recorder --format json > /tmp/tail.log 2>&1 &)
          sleep 20
          for p in terminal/health "orderflow?sym=NQ&day=2026-10-15" ticks1s status; do curl -s -m 10 -H 'Origin: https://strykertrading.com' "https://book-recorder.theelitegrey.workers.dev/$p" -o /dev/null -w "$p %{http_code}\n"; done
          sleep 15
          head -c 6000 /tmp/tail.log
