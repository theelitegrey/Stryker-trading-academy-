name: Discord server setup
# Manual only. Uses the TradeZoro bot token (secret) to read or build the TradeZoro Discord server from tools/discord/plan.json.
# mode=info prints the bot's public app id + the servers it is in. mode=apply builds channels/roles (never deletes).
on:
  push:
    branches: ['ops/discord-**']
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Run
        env:
          BOT: ${{ secrets.DISCORD_BOT_TOKEN }}
          MODE: ${{ vars.DISCORD_MODE || 'info' }}
          GUILD: '1565740274116857887'
        run: |
          M=$(cat tools/discord/MODE 2>/dev/null || echo info); MODE=$M python3 tools/discord/setup.py
