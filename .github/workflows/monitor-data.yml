# Global Monitor data pipeline — self-sustaining relay.
#
# Fetches GDELT, Yahoo Finance, WHO outbreak news, Polymarket and a DEFCON
# estimate, then publishes one monitor-data.json to the `data` branch (single
# force-pushed commit — the branch never accumulates history). The Global
# Monitor page reads it from raw.githubusercontent.com, which sends CORS
# headers.
#
# WHY A RELAY AND NOT A CRON: GitHub's scheduler is best-effort and it shows.
# '*/20' fired with 4-11 hour gaps; moving to quiet minutes (7,27,47) still
# produced only TWO scheduled runs in 24 hours — the data sat 6 hours stale
# while every run that did fire succeeded. So the schedule can never be the
# heartbeat. Instead each run refreshes the data every 20 minutes for ~5.5
# hours inside one job (public repo: standard runners are free), then
# dispatches its own successor via the API. The cron remains only as a
# backstop that revives a dropped chain (runner loss, GitHub incident), and
# every main deploy also revives it if the data has gone stale.

name: Global Monitor data

on:
  schedule:
    # Backstop only — the relay below is the real heartbeat. Quiet minutes,
    # hourly; if the chain ever dies this revives it within the hour-ish
    # (subject to GitHub's throttling, which is exactly why it's not the
    # primary mechanism).
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # the relay dispatches its own next run

jobs:
  # The hourly backstop used to queue behind the live chain and then get
  # CANCELLED when the chain dispatched its next link (GitHub keeps only one
  # pending run per concurrency group). Harmless, but it filled the run list
  # with red. Now a scheduled run first checks the published data: if it is
  # fresh, the chain is alive and the run ends green without starting a relay.
  # Dispatched runs (the chain itself, the deploy watchdog, manual) always relay.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - id: age
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "dispatched run: relay"; exit 0; fi
          gen=$(curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/data/monitor-data.json?t=$(date +%s)" | jq -r '.generatedAt // 0' 2>/dev/null || echo 0)
          age_min=$(( ($(date +%s%3N) - ${gen:-0}) / 60000 ))
          echo "monitor data age: ${age_min} minutes"
          if [ "$age_min" -gt 45 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "stale: reviving the chain"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "chain alive: nothing to do"; fi

  relay:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # One chain alive at a time. cancel-in-progress stays FALSE so a revival
    # queues behind a running chain instead of killing it mid-loop.
    concurrency:
      group: monitor-data
      cancel-in-progress: false
    runs-on: ubuntu-24.04         # pinned ahead of the ubuntu-latest -> 26.04 move
    timeout-minutes: 350          # 16 cycles x ~21 min ≈ 5h36m, under the 6h job cap
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Seed previous data (kept per-section when an upstream fails)
        run: |
          mkdir -p out
          curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/data/monitor-data.json" \
            -o out/previous.json || echo "no previous data yet"

      - name: Relay — refresh every 20 minutes for ~5.5 hours
        run: |
          set +e   # one bad cycle must not kill the chain
          for i in $(seq 1 16); do
            echo "=== cycle $i/16 $(date -u +%FT%TZ) ==="
            if node tools/fetch-monitor-data.js out/previous.json out/monitor-data.json; then
              (
                cd out
                rm -rf .git
                git init -q -b data
                git config user.email "actions@github.com"
                git config user.name "monitor-data bot"
                git add monitor-data.json
                git commit -q -m "refresh $(date -u +%FT%TZ)"
                git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
              ) && cp out/monitor-data.json out/previous.json \
                && echo "published cycle $i"
            else
              echo "cycle $i fetch failed — keeping previous data, retrying next cycle"
            fi
            [ "$i" -lt 16 ] && sleep 1200
          done
          true

      - name: Dispatch the next link in the chain
        if: success()
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor-data.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "next chain link dispatched" \
            || echo "self-dispatch failed — the hourly backstop cron will revive the chain"
