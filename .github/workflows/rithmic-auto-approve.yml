name: Rithmic review auto-approve
# Owner order 2026-10-06: approve every /rithmic-review sign-up. Moved here from the server timer on 2026-11-04
# because Google refuses these admin calls from the server's address (403). Logs show uid prefixes only (public repo).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rithmic-auto-approve
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: tools/ops
      - name: Token
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_CI_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse
          d=urllib.parse.urlencode({'grant_type':'refresh_token','refresh_token':os.environ['FIREBASE_TOKEN'],'client_id':'563584335869-fgrhgmd47bqnekij5i8b5pr03ho849e6.apps.googleusercontent.com','client_secret':'j9iVZfS8kkCEFUPaAeJV0sAi'}).encode()
          t=json.load(urllib.request.urlopen('https://oauth2.googleapis.com/token',d))['access_token']
          print('::add-mask::'+t); open('/tmp/fbtok','w').write(t)
          PY
      - name: Approve pending
        run: FB_TOKEN_FILE=/tmp/fbtok python3 tools/ops/rithmic_review_approve.py approve-all-pending
