# Fly.io alternative: from master-admin-panel/ run
#   fly launch --copy-config --no-deploy && fly volumes create panel_data -s 1 && fly deploy
app = "master-admin-panel"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

[[mounts]]
  source = "panel_data"
  destination = "/app/data"

[checks.health]
  type = "http"
  port = 8080
  path = "/healthz"
  interval = "1m"
  timeout = "5s"
