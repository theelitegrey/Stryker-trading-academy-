# Render blueprint for the Master Admin Panel (master-admin-panel/).
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# The disk keeps the JSON data across deploys and restarts; disks need a
# paid instance (Starter), the free tier has no persistent storage.
services:
  - type: web
    name: master-admin-panel
    runtime: docker
    rootDir: master-admin-panel
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: panel-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: ADMIN_PASSWORD
        sync: false        # set it in the dashboard; leave blank to set on first visit
      - key: ALERT_WEBHOOK_URL
        sync: false
