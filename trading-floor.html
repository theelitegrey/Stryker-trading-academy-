      <a href="courses.html" class="side-link">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>

    <div class="sidebar-foot">
      <a href="dashboard-user.html" class="user-chip">
        <div class="chip-avatar"></div>
        <div>
          <div class="chip-name">Trader</div>
          <div class="chip-role">—</div>
        </div>

  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1>Trading floor</h1>
        <p>Post daily bias, questions, or setups. Visible to every signed-in student.</p>
      </div>
    </div>

    <div class="panel">
      <div class="auth-error" id="floor-error"></div>

      <div class="rte-toolbar" id="floor-rte-toolbar">
        <button type="button" class="rte-btn" data-cmd="bold" title="Bold"><b>B</b></button>
        <button type="button" class="rte-btn" data-cmd="italic" title="Italic"><i>I</i></button>
        <button type="button" class="rte-btn" data-cmd="underline" title="Underline"><u>U</u></button>
        <span class="rte-sep"></span>
        <button type="button" class="rte-btn" id="floor-image-btn" title="Add image">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <input type="file" id="floor-image-input" accept="image/*" style="display:none;">
      </div>
      <div id="floor-post-text" class="rte-editable" contenteditable="true" data-placeholder="Daily bias, a setup you're watching, a question… Use @name to mention someone, #tag to label a topic."></div>
      <div id="floor-image-preview-wrap" style="display:none; margin-top:12px; position:relative; max-width:280px;">
        <img id="floor-image-preview" style="width:100%; border-radius:8px; border:1px solid var(--line); display:block;">
        <button type="button" class="icon-btn" id="floor-image-remove" style="position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.6);" title="Remove image">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <button class="btn btn-primary btn-sm" id="floor-post-btn" style="margin-top:14px;">Post</button>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Posts</h2>
        <span id="floor-count" style="font-family:var(--font-mono); font-size:12px; color:var(--ink-3);"></span>
      </div>
      <div class="level-tabs" id="floor-filter-tabs" style="margin-bottom:20px;">
        <button class="level-tab active" data-sort="new">New</button>
        <button class="level-tab" data-sort="top">Top</button>
        <button class="level-tab" data-sort="hot">Trending</button>
      </div>
      <div id="floor-active-tag-banner" style="display:none;"></div>
      <div id="floor-list"><p style="color:var(--ink-3); font-size:13.5px;">Loading…</p></div>
    </div>
  </main>
</div>
